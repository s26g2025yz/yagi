 document.getElementById("choices").innerHTML="";
 if(!pool.length){
  document.getElementById("quiz").innerHTML='<div class="complete"><h2>全問マスター達成！</h2><p>赤文字の全問題で3回正解しました。おめでとう！</p><button class="secondary" onclick="location.reload()">ページを再表示</button></div>';
  renderStats();return;
 }
 current=pool[state.cursor%pool.length];state.cursor++;save();
 document.getElementById("unit").textContent=current.unit;
 document.getElementById("count").textContent=`正解 ${count(current)} / 3回`;
 document.getElementById("prompt").textContent=current.prompt;
 renderChoices();
 renderStats();
}
function renderChoices(){
 const distractors=questions.filter(q=>q.answer!==current.answer).map(q=>q.answer);
 const shuffled=distractors.sort(()=>Math.random()-.5).slice(0,2);
 const options=[current.answer,...shuffled].sort(()=>Math.random()-.5);
 document.getElementById("choices").innerHTML=options.map((answer,i)=>
  `<button type="button" class="choice" data-answer="${i}" onclick="chooseAnswer(${i})"><span class="letter">${["A","B","C"][i]}</span>${answer}</button>`
 ).join("");
 window.currentOptions=options;
}
function chooseAnswer(index){
 if(locked||!current)return;
 locked=true;
 const selected=window.currentOptions[index];
 const correct=selected===current.answer;
 const fb=document.getElementById("feedback");
 document.querySelectorAll(".choice").forEach((button,i)=>{
  button.disabled=true;
  if(window.currentOptions[i]===current.answer)button.classList.add("correct");
  else if(i===index&&!correct)button.classList.add("wrong");
 });
 if(correct){
  state.counts[current.answer]=count(current)+1;save();
  fb.className="feedback good";
  fb.innerHTML=`<strong>正解！</strong><br><span class="answer">${current.answer}</span>：${current.prompt}<br>正解数 ${count(current)} / 3回${count(current)>=3?' — マスター！':''}`;
 }else{
  fb.className="feedback bad";
  fb.innerHTML=`<strong>不正解</strong><br>正解は <span class="answer">${current.answer}</span> です。<br>${current.prompt}<br>正解数は ${count(current)} / 3回のままです。`;
 }
 fb.style.display="block";
 document.getElementById("count").textContent=`正解 ${count(current)} / 3回`;
 renderStats();
}
document.getElementById("skip").addEventListener("click",next);
document.getElementById("reset").addEventListener("click",()=>{if(confirm("正解数と進捗をすべてリセットしますか？")){state={counts:{},cursor:0};save();location.reload();}});
renderStats();next();
</script>
</body></html>
