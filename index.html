<!doctype html>
<html lang="ja">
<head>

<title>認知科学概論｜一問一答 6〜8</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#243128;background:#f5f8ee}
*{box-sizing:border-box}body{margin:0;padding:20px 14px 40px}.wrap{max-width:720px;margin:auto}
header,.panel{background:white;border:1px solid #dce8d0;border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 6px} .sub{color:#647266;font-size:13px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:13px}
.stat{background:#f1f6eb;padding:8px 12px;border-radius:10px}
.bar{height:8px;background:#e7eddf;border-radius:10px;margin-top:12px;overflow:hidden}.fill{height:100%;width:0;background:#83b94c;transition:width .2s}
.tag{font-size:12px;color:#55743b;font-weight:700;margin-bottom:12px}
.question{font-size:19px;line-height:1.65;font-weight:700;margin:0 0 18px;white-space:pre-wrap}
.choices{display:grid;gap:10px}

.choice:disabled{cursor:default;opacity:1}.choice.correct{background:#edf7e7;border-color:#77ad4e;color:#315c20}.choice.wrong{background:#fff0ed;border-color:#d98a7d;color:#8c3024}
.feedback{margin-top:14px;padding:12px;border-radius:10px;background:#f4f6f2;line-height:1.6;display:none}.feedback.show{display:block}
.actions{display:flex;gap:10px;margin-top:16px}.actions button,.smallbtn{border:0;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:#79a943;color:white;flex:1}.secondary{background:#edf1e9;color:#39483a}
.note{font-size:12px;color:#6d786d;line-height:1.6;margin-top:12px}
@media(prefers-color-scheme:dark){:root{background:#171d17;color:#e8eee6}.panel,header{background:#222b22;border-color:#3b4938}.sub,.note{color:#b2c0ae}.stat{background:#303b2e}.bar{background:#394337}.choice{background:#293329;color:#e8eee6;border-color:#4a5948}.choice.correct{background:#29432a;color:#c9efb9}.choice.wrong{background:#492c29;color:#ffd0c7}.feedback{background:#303a30}.secondary{background:#3b463a;color:#e8eee6}}

</head>
<body><main class="wrap">
<header><h1>認知科学概論｜一問一答</h1><div class="sub">レビューシート 6-1〜8-2｜全30問・3択</div>
<div class="stats"><span class="stat">問題 <b id="count">1 / 30</b></span><span class="stat">正解 <b id="score">0</b></span><span class="stat">正答率 <b id="rate">0%</b></span></div><div class="bar"><div class="fill" id="progress"></div></div></header>
<section class="panel"><div class="tag" id="tag"></div><p class="question" id="question"></p><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="secondary" id="skip">スキップ</button><button class="primary" id="next" disabled>次の問題へ</button></div><div class="note">正解すると正答数に加算されます。選択肢は資料の正答と、関連する用語・概念から構成しています。</div></section>
<div class="actions"><button class="secondary" id="restart">最初からやり直す</button></div>
</main>

{unit:"6-1｜問2",q:"与えられた正規表現を用いるとき，生成されるはずのない単語はどれか。\n2-2. /い+え/",a:"え",c:["いえ","いいいいいいいえ","え"]},
{unit:"6-1｜問2",q:"与えられた正規表現を用いるとき，生成されるはずのない単語はどれか。\n2-3. /(女王|王様|貴族)と(庶民|貧民|市民)とへ1/",a:"貴族と庶民と王様",c:["王様と市民と王様","女王と貧民と女王","貴族と庶民と王様"]},
{unit:"6-2｜問1",q:"以下の説明に対して，空欄に入る正しい言葉を選べ。\nフールプルーフは，人間が（A）仕組みのことであり，フォールトトレラントは，失敗がおきたときに（B）仕組みのことである。フェイルセーフはフォールトトレラントと異なり，失敗が起きたときに（C）仕組みである。\n（A）に入る言葉はどれか。",a:"失敗できないようにする",c:["失敗できないようにする","運用を継続する","安全に停止する"]},
{unit:"6-2｜問1",q:"以下の説明に対して，空欄に入る正しい言葉を選べ。\nフールプルーフは，人間が（A）仕組みのことであり，フォールトトレラントは，失敗がおきたときに（B）仕組みのことである。フェイルセーフはフォールトトレラントと異なり，失敗が起きたときに（C）仕組みである。\n（B）に入る言葉はどれか。",a:"運用を継続する",c:["安全に停止する","運用を継続する","失敗できないようにする"]},
{unit:"6-2｜問1",q:"以下の説明に対して，空欄に入る正しい言葉を選べ。\nフールプルーフは，人間が（A）仕組みのことであり，フォールトトレラントは，失敗がおきたときに（B）仕組みのことである。フェイルセーフはフォールトトレラントと異なり，失敗が起きたときに（C）仕組みである。\n（C）に入る言葉はどれか。",a:"安全に停止する",c:["運用を継続する","失敗できないようにする","安全に停止する"]},
{unit:"6-2｜問2",q:"以下のインターフェースに関する説明に対応する正しい単語を選べ。\n1. ボタンの位置や形状は，OSが異なっても共通している",a:"一貫性",c:["一貫性","寛容性","応答性"]},
{unit:"6-2｜問2",q:"以下のインターフェースに関する説明に対応する正しい単語を選べ。\n2. ひと目見ただけで動きや機能がわかる性質",a:"アフォーダンス",c:["一貫性","アフォーダンス","応答性"]},
{unit:"6-2｜問2",q:"以下のインターフェースに関する説明に対応する正しい単語を選べ。\n3. 操作をしたらすぐに反応したり，待つ際もどれほどかを表示する",a:"応答性",c:["寛容性","一貫性","応答性"]},
{unit:"6-2｜問2",q:"以下のインターフェースに関する説明に対応する正しい単語を選べ。\n4. プロセスの処理中も他の作業ができたり，一時的に中断ができる",a:"寛容性",c:["アフォーダンス","寛容性","応答性"]},

{unit:"7-1｜問2",q:"バグの発生しにくいプログラムを作成するために，適切である内容をすべて選択せよ。",a:"1・2・4",c:["1・2・4","1・2・3","2・3・4"],why:"1. 定数には，その値が何をするかを意味する変数名をつけておく／2. 変数名を読んですぐに理解できる名前にしておく／4. 繰り返しに注目して処理をまとめる。"},
{unit:"7-1｜問3",q:"以下のpythonプログラムを読み，問いに答えよ。\n\ndef add(num1, num2):\n    return num1 + num2\n\nnum = 5\nresult = add(num, 3)\nprint("結果は" + str(result))\n\n3-1. このコードのadd関数をなんと呼ぶか。",a:"サブルーチン",c:["サブルーチン","グローバル変数","引数"]},
{unit:"7-1｜問3",q:"以下のpythonプログラムを読み，問いに答えよ。\n\ndef add(num1, num2):\n    return num1 + num2\n\nnum = 5\nresult = add(num, 3)\nprint("結果は" + str(result))\n\n3-2. このコードのnum変数をなんと呼ぶか。",a:"グローバル変数",c:["ローカル変数","グローバル変数","戻り値"]},
{unit:"7-1｜問3",q:"以下のpythonプログラムを読み，問いに答えよ。\n\ndef add(num1, num2):\n    return num1 + num2\n\nnum = 5\nresult = add(num, 3)\nprint("結果は" + str(result))\n\n3-3. 最終的にprint関数によって出力される文字列はなにか。",a:"結果は8",c:["結果は5","結果は3","結果は8"]},
{unit:"7-2｜問1",q:"二分探索に関する説明として，正しいものを選べ。",a:"整列された配列の中央の要素を比較し，探索対象が中央の要素より小さい場合は左側の半分を，そうでない場合は右側の半分を探索する",c:["整列された配列に対して，探索対象の値を見つけるために常に配列の最初から最後まで順番に調べる","配列内のすべての要素を同時に比較して，最も小さい値を見つける","整列された配列の中央の要素を比較し，探索対象が中央の要素より小さい場合は左側の半分を，そうでない場合は右側の半分を探索する"]},
{unit:"7-2｜問2",q:"以下の説明の空欄に当てはまる正しい言葉を入れよ。\nテキストエディタは，（A）ために使用される。それに対して，統合開発環境は，（B）するために使用される。比較すると，統合開発環境のほうが（C）という特徴がある。\n（A）に入る言葉はどれか。",a:"テキストやソースコードを書いて保存する",c:["テキストやソースコードを書いて保存する","コードの記述やコンパイル，デバッグを行う","プログラムを実行して管理する"]},
{unit:"7-2｜問2",q:"以下の説明の空欄に当てはまる正しい言葉を入れよ。\nテキストエディタは，（A）ために使用される。それに対して，統合開発環境は，（B）するために使用される。比較すると，統合開発環境のほうが（C）という特徴がある。\n（B）に入る言葉はどれか。",a:"コードの記述やコンパイル，デバッグを行う",c:["テキストやソースコードを書いて保存する","コードの記述やコンパイル，デバッグを行う","ファイルを圧縮して保存する"]},
{unit:"7-2｜問2",q:"以下の説明の空欄に当てはまる正しい言葉を入れよ。\nテキストエディタは，（A）ために使用される。それに対して，統合開発環境は，（B）するために使用される。比較すると，統合開発環境のほうが（C）という特徴がある。\n（C）に入る言葉はどれか。",a:"機能が豊富で多機能",c:["機能が少なく単機能","機能が豊富で多機能","文字入力に特化している"]},
{unit:"7-2｜問3",q:"以下の文章は，それぞれどちらを説明しているか。説明と対応する単語を選べ。\n3-1. プログラム開発において，試作とレビュー，改良を繰り返すことで製作していく。",a:"アジャイル型開発",c:["アジャイル型開発","ウォーターフォール型開発","ビッグバン型開発"]},
{unit:"7-2｜問3",q:"以下の文章は，それぞれどちらを説明しているか。説明と対応する単語を選べ。\n3-2. プログラム開発において，要件定義，設計，開発など1つずつ完了させてから次の工程に進めていく。",a:"ウォーターフォール型開発",c:["アジャイル型開発","ウォーターフォール型開発","プロトタイプ型開発"]},
{unit:"8-1｜問1",q:"OSが持つ役割として，正しいものをすべて選べ。",a:"1・2・3・5・6・7",c:["1・2・3・5・6・7","1・2・4・5・7・8","2・3・4・6・7・8"],why:"1. GUIやCUIの提供／2. アカウントの管理／3. ファイルシステムの管理／5. マウスやキーボード等のデバイス駆動／6. 仮想メモリのページ管理／7. アプリケーションのメモリ確保。"},
{unit:"8-1｜問2",q:"メモリリークとはなにか。正しい説明を選べ。",a:"プログラムがメモリを使用後に解放しないことによって，利用可能なメモリが減少する現象",c:["プログラムがメモリを使用後に解放しないことによって，利用可能なメモリが減少する現象","メモリが一時的に無効化されることによって，プログラムの実行速度が低下する現象","プログラムが必要以上にメモリを使用し，システムがフリーズすること"]},
{unit:"8-1｜問3",q:"マルチタスクの説明のうち，間違っているものを1つ選べ。",a:"今の主流は協調マルチタスクである",c:["プリエンプティブマルチタスクとは，他のプロセスを割り込ませることである","協調マルチタスクとは，一つのプロセスが時々停止して他のプロセスが処理できるように譲ることである","今の主流は協調マルチタスクである"]},
{unit:"8-2｜問1",q:"PCの中で，起動しているOSとは別のOSをシミュレートして動かす技術をなんというか。",a:"仮想化",c:["高速化","仮想化","量子化"]},
{unit:"8-2｜問2",q:"以下の選択肢のうち，主キーの説明として正しいものはどれか。すべて選べ。",a:"2・3",c:["1・2","2・3","1・3・4"],why:"2. テーブル内で重複する値を持つことができない／3. その列が空欄となっているレコードは許されない。"},
{unit:"8-2｜問3",q:"完全バックアップと差分バックアップの説明として，間違っているものを一つ選択せよ。",a:"差分バックアップは，前日までから変更された部分だけをバックアップする",c:["完全バックアップは，全てのデータをバックアップする方式である","差分バックアップは，前回の完全バックアップ以降に変更されたデータをバックアップする方式である","差分バックアップは，前日までから変更された部分だけをバックアップする"]}
];
let index=0,score=0,answered=false,order=[];
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function updateStats(){$("count").textContent=Math.min(index+1,questions.length)+" / "+questions.length;$("score").textContent=score;$("rate").textContent=(index?Math.round(score/index*100):0)+"%";$("progress").style.width=(index/questions.length*100)+"%"}
function render(){
 if(index>=questions.length){$("tag").textContent="結果";$("question").textContent="全問終了！";$("choices").innerHTML="";$("feedback").className="feedback show";$("feedback").textContent="正解数："+score+" / "+questions.length+"問（"+Math.round(score/questions.length*100)+"%）";$("next").disabled=true;$("next").textContent="終了";$("skip").disabled=true;updateStats();return}
 answered=false;const q=questions[index];$("tag").textContent=q.unit;$("question").textContent=q.q;$("choices").innerHTML="";$("feedback").className="feedback";$("feedback").textContent="";$("next").disabled=true;$("next").textContent="次の問題へ";
 order=shuffle(q.c);order.forEach((v,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=(i+1)+"．"+v;b.onclick=()=>choose(v,b);$("choices").appendChild(b)});updateStats()
}
function choose(v,btn){if(answered)return;answered=true;const q=questions[index];const buttons=[...$("choices").children];buttons.forEach(b=>{b.disabled=true;if(b.textContent.slice(2)===q.a)b.classList.add("correct")});let ok=v===q.a;if(!ok)btn.classList.add("wrong");if(ok)score++;$("feedback").className="feedback show";$("feedback").innerHTML=(ok?"正解！":"不正解。正解は「"+q.a+"」です。")+(q.why?"<br>"+q.why:"");$("next").disabled=false;updateStats()}
function next(){if(index<questions.length)index++;render()}
$("next").onclick=next;$("skip").onclick=next;$("restart").onclick=()=>{index=0;score=0;$("skip").disabled=false;render()};render();
</script></body></html>
